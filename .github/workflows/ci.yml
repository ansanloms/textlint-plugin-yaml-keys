name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4
          cache: true
      - run: deno ci
      - run: deno task lint
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - name: Verify dist/index.js is up to date
        run: git diff --exit-code dist/index.js
      - name: Smoke test with examples
        working-directory: examples
        run: |
          deno ci
          deno task textlint . -f json > result.json || true
          jq -e '[.[] | select(.filePath | endswith("file.yaml")) | .messages | length] | add == 2' result.json
      - name: Verify lockfiles are unchanged
        run: git diff --exit-code deno.lock examples/deno.lock
